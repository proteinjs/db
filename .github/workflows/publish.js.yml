name: Publish Db Packages

on:
  push:
    branches:
      - main

# One publish at a time: two overlapping runs race at the publish step — the earlier run's
# release commit rebases onto the later push and stamps a version/tag whose git history COVERS
# the later commit, while publishing the tarball built from its own older checkout; the later
# run then sees "no changed packages" and the newer code never ships. The concurrency group
# serializes publish jobs; the "Abort if main advanced" guard closes the remaining window —
# only the run whose checkout is still the branch tip publishes, and the tip push's own run
# releases everything pending.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# THE RUN'S SHAPE: build -> test -> finalize with the built tree as one artifact. The build + test
# half lives in the reusable _test.yml both this file and verify-train.yml call, so the tip of the
# `train` branch is verified on CI by the release's own jobs. After a CI-verified departure (the
# train tip swept by verify-train, the departure commit on top of it changing only .train/)
# build's VerifiedTree.js finds that run and the test job is SKIPPED: the run is build + finalize.
# Nothing on the release path is reimplemented: lerna is chained, the guard's logic is unchanged,
# and the lock edits finalize commits are the build job's own — they ride in the artifact.
env:
  # --no-audit --no-fund for lerna's version-phase lock re-stamp in finalize; _test.yml carries
  # the same pair for its own installs — npm reads npm_config_<key> from the environment.
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  verify:
    # The build + test half: _test.yml (the same call verify-train.yml makes for the train tip).
    # skip-verified: the test job is skipped when build's VerifiedTree.js finds a green verify-train
    # run of this tree; the permissions are what its jobs need.
    uses: ./.github/workflows/_test.yml
    with:
      skip-verified: true
    secrets: inherit
    permissions:
      contents: read
      actions: read
  finalize:
    name: finalize (guard, lock commit, lerna publish)
    # The test job green (or skipped on a verified tree), or nothing here runs: a red sweep leaves
    # main unpublished, exactly as it did in the single-job shape.
    needs: verify
    runs-on: ubuntu-latest
    # Guard + lock commit + lerna publish: well under a minute on ordinary runs. The bound holds
    # the re-stamp step's two clocks with margin: the job's preamble (checkout, the artifact, the
    # guard, lerna publish — about a minute; up to 3 on a slow runner) + MintServed's 15-minute wait
    # + LockFloors' 5-minute retry clock and the stamps and checks of its last round (about half a
    # minute) + the lock commit's push (seconds): about 24 minutes worst case; 30 leaves 6.
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      # The built workspace, restored: the names are the call's OUTPUTS — never retyped here, so a
      # rename in _test.yml cannot desync the download.
      WORKSPACE_ARTIFACT: ${{ needs.verify.outputs.artifact }}
      WORKSPACE_TARBALL: ${{ needs.verify.outputs.tarball }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # lerna versions from the tags visible at checkout, and the guard compares against
          # origin/main.
          fetch-depth: "0"

      - name: Configure git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup Node.js
        # No npm cache: nothing installs here — lerna comes with the artifact.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup NPM authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check NPM token validity
        run: |
          if ! npm_output=$(npm org ls proteinjs --json 2>&1); then
            echo "NPM token validation failed. Error details:"
            echo "$npm_output"
            exit 1
          fi

      - name: Download the built workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WORKSPACE_ARTIFACT }}
          path: ${{ runner.temp }}/artifact

      - name: Unpack the built workspace over the checkout
        # After this the tree is the build job's: its dist (what lerna packs), its root
        # node_modules (lerna itself), and its edits to tracked files — the re-stamped
        # package-locks — which the lock commit below stages with `-u`.
        run: zstd -d -q -c "$RUNNER_TEMP/artifact/$WORKSPACE_TARBALL" | tar -xf - -C "$GITHUB_WORKSPACE"

      # The stale-checkout guard (see race note at top). Runs AFTER the build and the sweep so
      # the unguarded window shrinks from minutes to the seconds between this check and lerna's
      # push.
      - name: Abort if main advanced (stale-checkout guard)
        id: tip
        run: |
          git fetch origin main --quiet
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "origin/main advanced past this run's checkout — skipping version+publish; the tip push's run releases everything pending (see race note at top of the workflow)."
          fi

      - name: Commit package-locks
        # Tracked files only (`-u`): this step commits what `npm i`/the build changed in files the
        # tree already owns (the package-locks, package.json normalization — made in the build job
        # and restored by the unpack above) and never sweeps the workspace for untracked files.
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          git add -u
          if git diff --staged --exit-code; then
            echo "No changes to commit."
          else
            git commit -m "chore(version) update package-locks [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      - name: Version and Publish
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          npx lerna publish --yes --no-private
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Re-stamp the consumer locks for the mint
        # lerna's release commit raises each sibling consumer's floor when a package it depends on
        # is published from this repo (packages/file-storage-drivers/google-cloud-storage:
        # `@proteinjs/db-file` ^1.7.22 -> ^1.8.0) and mirrors the range into the lock's root block —
        # lerna 8.1.2's update-lockfile-version.js is a JSON rewrite, and its only `npm install
        # --package-lock-only` runs on the ROOT lock, which declares no package. The lock's
        # INSTALLED entry — the pre-publish stamp the build's `npm i` wrote and the lock commit
        # above shipped — stays at the old version, so main refuses `npm ci` in every consumer
        # (EUSAGE: "lock file's @proteinjs/db-file@1.7.22 does not satisfy
        # @proteinjs/db-file@1.8.0") until someone re-stamps by hand. Now that the registry serves
        # the mint: LockFloors.js --restamp resolves the torn trees only (`npm i
        # --package-lock-only` with this job's npm 10 — lock stamps are npm-major dependent), proves
        # every tree coherent, and the locks ride main as the mint's second commit; a mint that
        # moved no consumer floor commits nothing. "Now that the registry serves the mint" is a WAIT,
        # not an assumption: `lerna publish` returns on the registry's accept, and the packument a
        # resolver reads lags it (run 36295867264 stamped at 05:04:51Z, ETARGET on db-file@^1.10.0;
        # the registry served 1.10.0 ~40 s later — LockFloors then threw on that ETARGET, so its
        # retry rounds never ran and main stayed torn). MintServed.js polls `npm view <name>@<version>
        # version` for every tag this run's `lerna publish` made (the tags at HEAD), 10 s apart on one
        # 15-minute clock (run 36818699801: a ten-package publish had its last package served about
        # 450 s after the accept, past the 5-minute clock this step first shipped with — the lag grows
        # with the publish), one "served after N s" line per package; a package still not served is a
        # WARNING line and exit 1, and the re-stamp still tries (`|| [ $? -eq 1 ]`: only a timeout
        # goes on; git or npm unrunnable stops here). LockFloors --restamp retries a stamp the
        # registry refuses (ETARGET / E404) 20 s apart on its own 5-minute clock before reporting the
        # tree torn, so a package served a minute after the wait expired still lands. Best-effort by
        # design (continue-on-error): the packages are published, so a registry still not serving the
        # mint past both clocks leaves main as lerna left it, this step red naming the floor it never
        # served, the job green; `node .github/scripts/LockFloors.js --restamp` under npm 10,
        # committed, is the hand recipe. The job's timeout-minutes above is sized to both clocks.
        if: steps.tip.outputs.is_tip == 'true'
        continue-on-error: true
        run: |
          node .github/scripts/MintServed.js || [ $? -eq 1 ]
          node .github/scripts/LockFloors.js --restamp
          git add -u -- package-lock.json '*/package-lock.json'
          if git diff --staged --quiet; then
            echo "every lock agrees with the mint — nothing to commit."
          else
            git commit -m "chore(locks): consumer locks re-stamped for the mint [skip ci]"
            git push origin HEAD:main
          fi
